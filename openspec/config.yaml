schema: "openspec/v1"
project: "boilerplate-maria"
mode: "hybrid"
strict_tdd: true

stack:
  monorepo: true
  backend:
    runtime: "Node.js (v24.x)"
    framework: "Express 4.18"
    database: "SQLite via node:sqlite DatabaseSync"
    validation: "Joi 17.12"
    email_service: "Nodemailer (simulated/jsonTransport)"
  frontend:
    runtime: "Node.js (v24.x)"
    framework: "React 18.2 + Vite 5.2"
    routing: "React Router DOM 6.22"
    styling: "Tailwind CSS 3.4 + PostCSS"
    http_client: "Axios 1.6"
    linter_formatter: "Biome 1.6"

testing:
  backend:
    runner: "jest"
    command: "npm test"
    cwd: "back"
    types:
      - "unit"
      - "schema-validation"
    coverage: false
  frontend:
    runner: "jest"
    command: "npm test"
    cwd: "front"
    types:
      - "unit"
      - "helpers"
    coverage: false

conventions:
  git:
    hooks: "husky"
    commit_convention: "conventional-commits"
  code_style:
    frontend: "Biome (indent: 2 spaces, single quotes, es5 trailing commas, line width: 100)"
    backend: "CommonJS standard"
